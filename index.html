<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity #1: Customer Service Feedback</title>
    <style>
        body {
            font-family: 'Segoe UI', 'Roboto', Helvetica, Arial, sans-serif;
            background: #b2bec5;
            color: #050505;
            margin: 0;
            padding: 40px 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 750px;
            margin: 0 auto;
            background-color: transparent;
        }

        header {
            background: #dbd1d1;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            text-align: center;
            margin-bottom: 30px;
            border-top: 6px solid #ff6b6b;
        }

        h1 {
            color: #2d3748;
            margin: 0 0 10px 0;
            font-size: 2em;
        }

        p.intro {
            color: #2f3d52a5;
            margin: 0;
            font-size: 1.1em;
        }

        fieldset {
            background: #e2dada;
            border: none;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 25px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            transition: transform 0.2s ease;
        }

        fieldset:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px rgba(0, 0, 0, 0.1);
        }

        legend {
            font-weight: 700;
            color: #485162;
            font-size: 1.25em;
            padding: 0 10px;
            margin-bottom: 20px;
            background: #e2e8f0;
            border-radius: 4px;
        }

        .question-group {
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid #c4b2b2;
        }
        
        .question-group:last-child {
            border-bottom: none;
        }

        label.q-text {
            display: block;
            font-weight: 600;
            margin-bottom: 10px;
            color: #2d3748;
            font-size: 1.05em;
        }

        select, input[type="text"], input[type="number"], textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            background-color: #f8fafc;
            font-size: 1em;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        select:focus, input:focus, textarea:focus {
            border-color: #575e7c;
            background-color: #fff;
            outline: none;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
        }

        .options-group label {
            display: inline-flex;
            align-items: center;
            margin-right: 20px;
            margin-bottom: 10px;
            cursor: pointer;
            padding: 8px 15px;
            border-radius: 20px;
            background: #f7fafc;
            transition: background 0.2s;
        }

        .options-group label:hover {
            background: #edf2f7;
        }

        input[type="radio"], input[type="checkbox"] {
            margin-right: 8px;
            accent-color: #667eea;
            transform: scale(1.2);
        }

        .likert-scale {
            display: flex;
            justify-content: space-between;
            background: #f8fafc;
            padding: 15px;
            border-radius: 8px;
        }
        
        .likert-option {
            text-align: center;
            flex: 1;
            font-size: 0.9em;
            cursor: pointer;
        }
        
        .likert-option input {
            display: block;
            margin: 0 auto 8px auto;
        }

        button.submit-btn {
            display: block;
            width: 100%;
            padding: 18px;
            background: linear-gradient(to right, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(118, 75, 162, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 20px;
        }

        button.submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(118, 75, 162, 0.5);
        }

        button.submit-btn:active {
            transform: translateY(-1px);
        }

        input[type="range"] {
            width: 80%;
            margin-right: 10px;
            accent-color: #764ba2;
        }

        output {
            font-weight: bold;
            font-size: 1.2em;
            color: #764ba2;
        }

        @media (max-width: 600px) {
            .likert-scale {
                flex-direction: column;
                align-items: flex-start;
            }
            .likert-option {
                display: flex;
                align-items: center;
                margin-bottom: 10px;
                width: 100%;
                text-align: left;
            }
            .likert-option input {
                margin: 0 15px 0 0;
            }
            body {
                padding: 20px 10px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Customer Service Feedback</h1>
        <p class="intro">We value your opinion. Please help us improve your online shopping experience.</p>
    </header>

    <form action="thankyou.html" method="get">
        
        <fieldset>
            <legend>1. Customer Purchase Experience</legend>
            
            <div class="question-group">
                <label class="q-text" for="q1">1. How often do you shop with us?</label>
                <select id="q1" name="shop_frequency" required>
                    <option value="">-- Select an option --</option>
                    <option value="first_time">This is my first time</option>
                    <option value="monthly">Once a month</option>
                    <option value="quarterly">Once every 3 months</option>
                    <option value="yearly">Once a year</option>
                </select>
            </div>

            <div class="question-group">
                <label class="q-text">2. How easy was it to navigate our website?</label>
                <div class="likert-scale">
                    <label class="likert-option"><input type="radio" name="nav_ease" value="1">Very Difficult</label>
                    <label class="likert-option"><input type="radio" name="nav_ease" value="2">Difficult</label>
                    <label class="likert-option"><input type="radio" name="nav_ease" value="3">Neutral</label>
                    <label class="likert-option"><input type="radio" name="nav_ease" value="4">Easy</label>
                    <label class="likert-option"><input type="radio" name="nav_ease" value="5">Very Easy</label>
                </div>
            </div>

            <div class="question-group">
                <label class="q-text">3. Were the product descriptions accurate?</label>
                <div class="options-group">
                    <label><input type="radio" name="desc_accuracy" value="yes"> Yes</label>
                    <label><input type="radio" name="desc_accuracy" value="no"> No</label>
                </div>
            </div>

            <div class="question-group">
                <label class="q-text" for="q4">4. On a scale of 1 to 5, rate the variety of products available.</label>
                <div style="display: flex; align-items: center;">
                    <input type="range" id="q4" name="variety_rating" min="1" max="5" oninput="this.nextElementSibling.value = this.value">
                    <output>3</output><span style="margin-left:5px; color:#666;">/ 5</span>
                </div>
            </div>

            <div class="question-group">
                <label class="q-text" for="q5">5. Which payment method did you use?</label>
                <select id="q5" name="payment_method">
                    <option value="credit_card">Credit/Debit Card</option>
                    <option value="paypal">PayPal/Digital Wallet</option>
                    <option value="cod">Cash on Delivery</option>
                    <option value="other">Other</option>
                </select>
            </div>
        </fieldset>

        <fieldset>
            <legend>2. Delivery Experience</legend>

            <div class="question-group">
                <label class="q-text">6. Did your order arrive on the estimated delivery date?</label>
                <div class="options-group">
                    <label><input type="radio" name="on_time" value="yes"> Yes</label>
                    <label><input type="radio" name="on_time" value="no"> No</label>
                </div>
            </div>

            <div class="question-group">
                <label class="q-text">7. How would you rate the packaging quality?</label>
                <div class="likert-scale">
                    <label class="likert-option"><input type="radio" name="packaging" value="poor">Poor</label>
                    <label class="likert-option"><input type="radio" name="packaging" value="fair">Fair</label>
                    <label class="likert-option"><input type="radio" name="packaging" value="good">Good</label>
                    <label class="likert-option"><input type="radio" name="packaging" value="excellent">Excellent</label>
                </div>
            </div>

            <div class="question-group">
                <label class="q-text">8. Was the tracking information provided helpful?</label>
                <div class="options-group">
                    <label><input type="radio" name="tracking" value="yes"> Yes</label>
                    <label><input type="radio" name="tracking" value="no"> No</label>
                </div>
            </div>

            <div class="question-group">
                <label class="q-text" for="q9">9. Rate the speed of delivery (1-10).</label>
                <input type="number" id="q9" name="speed_rating" min="1" max="10" placeholder="Enter 1-10">
            </div>

            <div class="question-group">
                <label class="q-text">10. Did you experience any damage to the item?</label>
                <div class="options-group">
                    <label><input type="radio" name="damage" value="yes"> Yes</label>
                    <label><input type="radio" name="damage" value="no"> No</label>
                </div>
            </div>
        </fieldset>

        <fieldset>
            <legend>3. Customer Service Interaction</legend>

            <div class="question-group">
                <label class="q-text">11. Have you contacted support regarding this order?</label>
                <div class="options-group">
                    <label><input type="radio" name="contacted_support" value="yes"> Yes</label>
                    <label><input type="radio" name="contacted_support" value="no"> No</label>
                </div>
            </div>

            <div class="question-group">
                <label class="q-text" for="q12">12. If yes, which channel did you use?</label>
                <select id="q12" name="support_channel">
                    <option value="none">I did not contact support</option>
                    <option value="email">Email</option>
                    <option value="chat">Live Chat</option>
                    <option value="phone">Phone Call</option>
                    <option value="social">Social Media</option>
                </select>
            </div>

            <div class="question-group">
                <label class="q-text">13. "The agent was knowledgeable about my issue."</label>
                <div class="likert-scale">
                    <label class="likert-option"><input type="radio" name="knowledge" value="1">Str. Disagree</label>
                    <label class="likert-option"><input type="radio" name="knowledge" value="2">Disagree</label>
                    <label class="likert-option"><input type="radio" name="knowledge" value="3">Neutral</label>
                    <label class="likert-option"><input type="radio" name="knowledge" value="4">Agree</label>
                    <label class="likert-option"><input type="radio" name="knowledge" value="5">Str. Agree</label>
                </div>
            </div>

            <div class="question-group">
                <label class="q-text">14. Rate the professionalism of the support team.</label>
                <div class="options-group">
                    <label><input type="radio" name="pro_rating" value="1"> ⭐ 1</label>
                    <label><input type="radio" name="pro_rating" value="2"> ⭐ 2</label>
                    <label><input type="radio" name="pro_rating" value="3"> ⭐ 3</label>
                    <label><input type="radio" name="pro_rating" value="4"> ⭐ 4</label>
                    <label><input type="radio" name="pro_rating" value="5"> ⭐ 5</label>
                </div>
            </div>

            <div class="question-group">
                <label class="q-text">15. Was your issue resolved on the first contact?</label>
                <div class="options-group">
                    <label><input type="radio" name="resolved_first" value="yes"> Yes</label>
                    <label><input type="radio" name="resolved_first" value="no"> No</label>
                    <label><input type="radio" name="resolved_first" value="na"> N/A</label>
                </div>
            </div>
        </fieldset>

        <fieldset>
            <legend>4. Overall Satisfaction</legend>

            <div class="question-group">
                <label class="q-text">16. Overall, how satisfied are you?</label>
                <div class="likert-scale">
                    <label class="likert-option"><input type="radio" name="satisfaction" value="1">Very Dissatisfied</label>
                    <label class="likert-option"><input type="radio" name="satisfaction" value="2">Dissatisfied</label>
                    <label class="likert-option"><input type="radio" name="satisfaction" value="3">Neutral</label>
                    <label class="likert-option"><input type="radio" name="satisfaction" value="4">Satisfied</label>
                    <label class="likert-option"><input type="radio" name="satisfaction" value="5">Very Satisfied</label>
                </div>
            </div>

            <div class="question-group">
                <label class="q-text" for="q17">17. How likely are you to recommend us? (NPS)</label>
                <div style="display: flex; align-items: center;">
                    <input type="range" id="q17" name="nps" min="0" max="10" oninput="this.nextElementSibling.value = this.value">
                    <output>5</output><span style="margin-left:5px; color:#666;">/ 10</span>
                </div>
            </div>

            <div class="question-group">
                <label class="q-text">18. Will you purchase from us again?</label>
                <div class="options-group">
                    <label><input type="radio" name="return_customer" value="yes"> Yes</label>
                    <label><input type="radio" name="return_customer" value="no"> No</label>
                    <label><input type="radio" name="return_customer" value="maybe"> Maybe</label>
                </div>
            </div>

            <div class="question-group">
                <label class="q-text" for="q19">19. How do we compare to competitors?</label>
                <select id="q19" name="competitor_compare">
                    <option value="better">Much Better</option>
                    <option value="same">About the Same</option>
                    <option value="worse">Worse</option>
                </select>
            </div>
        </fieldset>

        <fieldset>
            <legend>5. Feedback & Suggestions</legend>

            <div class="question-group">
                <label class="q-text" for="q20">20. What is one thing we could do better?</label>
                <textarea id="q20" name="improvement" rows="4" placeholder="Share your thoughts..."></textarea>
            </div>

            <div class="question-group">
                <label class="q-text" for="q21">21. Describe a positive experience you had.</label>
                <textarea id="q21" name="positive_feedback" rows="4" placeholder="Share your thoughts..."></textarea>
            </div>
        </fieldset>

        <button type="submit" class="submit-btn">Submit Feedback</button>

    </form>
</div>

</body>
</html>
