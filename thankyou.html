<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Thank You</title>

    <style>
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgb(163, 178, 178);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .thankyou-card {
            background: #ffffff;
            padding: 40px 50px;
            border-radius: 12px;
            text-align: center;
            width: 90%;
            max-width: 420px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
            animation: fadeIn 0.8s ease-in-out;
        }

        .checkmark {
            font-size: 50px;
            color: #28a745;
            background: #eafaf1;
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        h1 {
            margin-bottom: 10px;
            color: #333;
        }

        p {
            color: #666;
            font-size: 15px;
            margin-bottom: 25px;
        }

        a {
            text-decoration: none;
            background: #667eea;
            color: white;
            padding: 10px 22px;
            border-radius: 6px;
            transition: background 0.3s ease;
        }

        a:hover {
            background: #5a67d8;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <div class="thankyou-card">
        <div class="checkmark">✔</div>
        <h1>Thank You!</h1>
        <p>Your feedback has been submitted successfully.</p>
        <a href="index.html">Go Back to Home</a>
    </div>

</body>
</html>
